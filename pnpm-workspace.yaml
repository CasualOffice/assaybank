# The fifteen workspaces of CODE-GRAPH.md. Adding a directory under apps/ or
# packages/ is all that is needed: turbo, eslint, vitest and typecheck pick it up
# with no further wiring (P0 step 1).
packages:
  - 'apps/*'
  - 'packages/*'
