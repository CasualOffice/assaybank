# Documentation gates. ARMED NOW — this workflow enforces on every pull request
# today, against documentation-only content, and it is the one workflow that is
# expected to fail a pull request in the current state of the repository.
#
# Four checks:
#   scripts/check-doc-freshness.mjs   registration both ways, metadata, age, index
#                                     coverage, and — on a pull request — the trigger
#                                     rules from docs/DOC-OWNERSHIP.md against the diff
#   scripts/check-links.mjs           every relative link and heading anchor resolves
#   scripts/check-task-ids.mjs        every H-NNN names one real tracker row
#   scripts/gen-code-graph.mjs --check CODE-GRAPH.md is in sync with code-graph.json
#
# The doctrine behind the freshness gate, and the escalation path for a document
# that goes stale, are in docs/DOC-OWNERSHIP.md. The gate is deliberately annoying;
# the alternative is a design record nobody trusts within six months.
#
# The scheduled run exists for age alone. Age never blocks a pull request — only
# trigger rules do — so without a nightly run a document could pass its maximum age
# unnoticed simply because nobody happened to open a pull request that touched it.

name: Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 06:15 UTC daily. Staleness is reported, never merged-blocked.
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: Freshness, links and code graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the pull-request diff can be computed against the base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Collect changed files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          echo "Changed files in this pull request:"
          cat changed-files.txt
          echo "count=$(wc -l < changed-files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Doc freshness and trigger rules
        if: github.event_name == 'pull_request'
        run: node scripts/check-doc-freshness.mjs --changed-from changed-files.txt

      - name: Doc freshness
        if: github.event_name != 'pull_request'
        run: node scripts/check-doc-freshness.mjs

      # Written as a separate step so a JSON report exists even when the human
      # readable step above has already failed the job.
      - name: Freshness report (JSON)
        if: always()
        run: |
          if [ -f changed-files.txt ]; then
            node scripts/check-doc-freshness.mjs --json --changed-from changed-files.txt > doc-freshness.json || true
          else
            node scripts/check-doc-freshness.mjs --json > doc-freshness.json || true
          fi

      - name: Relative links and anchors
        if: always()
        run: node scripts/check-links.mjs

      - name: Task ids resolve
        if: always()
        run: node scripts/check-task-ids.mjs

      - name: Code graph in sync
        if: always()
        run: node scripts/gen-code-graph.mjs --check

      - name: Licence headers (ADR-020)
        if: always()
        run: node scripts/check-licence-headers.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-reports
          path: doc-freshness.json
          if-no-files-found: ignore
          retention-days: 14
